plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.interativa.player'
    compileSdk 34

    defaultConfig {
        // ID diferente do app antigo (com.interativa.tv) para os dois poderem coexistir
        applicationId "com.interativa.player"
        minSdk 21
        targetSdk 34
        versionCode 5
        versionName "1.4.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            // TODO: trocar por uma keystore própria antes de distribuir em escala
            signingConfig signingConfigs.debug
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "interativa-player-${variant.buildType.name}.apk"
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core-ktx:1.12.0'

    // Player nativo (vídeo, IPTV/HLS) com cache em disco
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.4.1'
    implementation 'androidx.media3:media3-datasource:1.4.1'
    implementation 'androidx.media3:media3-database:1.4.1'

    // Mesmo protocolo do servidor (socket.io 4.x)
    implementation 'io.socket:socket.io-client:2.1.1'

    // Imagens com cache em disco (funciona offline)
    implementation 'io.coil-kt:coil:2.7.0'
}
